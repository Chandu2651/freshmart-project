<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fresh Farm Mart – Vegetables, Leafy Greens & Fruits</title>
<style>
:root{--bg:#f6faf3;--card:#fff;--text:#1d2b1a;--muted:#5d6b58;--green:#2e7d32;--line:#dbe6d5;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a11;--card:#1c271b;--text:#e8f2e5;--muted:#a3b39e;--green:#66bb6a;--line:#2c3b2a;--on:#0d1a0d}}
:root[data-theme="dark"]{--bg:#121a11;--card:#1c271b;--text:#e8f2e5;--muted:#a3b39e;--green:#66bb6a;--line:#2c3b2a;--on:#0d1a0d}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:90px}
header{background:var(--green);color:var(--on);padding:22px 16px;text-align:center}
header h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
nav{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 16px;border-radius:20px;font-size:.95rem;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--green);color:var(--on);border-color:var(--green)}
main{max-width:900px;margin:0 auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.emo{font-size:2.6rem}.card h3{margin:6px 0 2px;font-size:1rem}.card .p{color:var(--muted);font-size:.9rem;margin-bottom:10px}
.add{background:var(--green);color:var(--on);border:0;border-radius:10px;padding:8px 0;width:100%;font-size:.95rem;cursor:pointer}
.qty{display:flex;align-items:center;justify-content:space-between}
.qty button{width:36px;height:36px;border-radius:10px;border:1px solid var(--green);background:var(--card);color:var(--green);font-size:1.2rem;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;z-index:9}
.bar button{background:var(--green);color:var(--on);border:0;border-radius:10px;padding:12px 18px;font-size:1rem;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);width:min(92vw,420px);padding:18px}
dialog input,dialog textarea{width:100%;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.row{display:flex;justify-content:space-between;padding:4px 0;font-size:.95rem}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 16px}
</style>
</head>
<body>
<header><h1>🥬 Fresh Farm Mart</h1><p>Fresh vegetables, leafy greens &amp; fruits delivered to you</p></header>
<nav id="tabs"></nav>
<main><div class="grid" id="grid"></div></main>
<footer>📞 Call / WhatsApp: +91 99999 99999 · Prices per kg / bunch</footer>
<div class="bar"><div><strong id="tot">₹0</strong><div style="font-size:.8rem;color:var(--muted)" id="cnt">0 items</div></div><button id="view">View Cart &amp; Order</button></div>
<dialog id="dlg">
<h3 style="margin-top:0">Your Order</h3><div id="lines"></div>
<div class="row"><strong>Total</strong><strong id="t2"></strong></div>
<input id="nm" placeholder="Your name"><input id="ph" placeholder="Phone number" inputmode="tel"><textarea id="ad" rows="2" placeholder="Delivery address"></textarea>
<div style="display:flex;gap:8px;margin-top:8px"><a class="add" id="send" href="#" target="_blank" rel="noopener noreferrer" style="text-decoration:none;text-align:center;display:block;padding:10px 0">Order on WhatsApp</a><button class="add" style="background:var(--muted)" id="close">Close</button></div>
</dialog>
<script>
var WHATSAPP="919999999999"; // change to your number: country code + number, no + or spaces
var P=[
["Vegetables","🍅","Tomato",30,"kg"],["Vegetables","🥔","Potato",35,"kg"],["Vegetables","🧅","Onion",40,"kg"],["Vegetables","🥕","Carrot",60,"kg"],
["Vegetables","🍆","Brinjal",50,"kg"],["Vegetables","🌶️","Green Chilli",80,"kg"],["Vegetables","🥒","Cucumber",35,"kg"],["Vegetables","🥦","Broccoli",90,"kg"],
["Leafy Vegetables","🥬","Spinach (Palak)",20,"bunch"],["Leafy Vegetables","🌿","Coriander",15,"bunch"],["Leafy Vegetables","🌿","Mint (Pudina)",15,"bunch"],["Leafy Vegetables","🥬","Methi (Fenugreek)",20,"bunch"],["Leafy Vegetables","🥬","Cabbage",30,"kg"],["Leafy Vegetables","🥬","Gongura",25,"bunch"],
["Fruits","🍌","Banana",50,"dozen"],["Fruits","🍎","Apple",180,"kg"],["Fruits","🥭","Mango",120,"kg"],["Fruits","🍇","Grapes",100,"kg"],["Fruits","🍉","Watermelon",25,"kg"],["Fruits","🍊","Orange",80,"kg"],["Fruits","🍍","Pineapple",60,"each"],["Fruits","🥥","Coconut",35,"each"]
];
var cats=["All","Vegetables","Leafy Vegetables","Fruits"],cur="All",cart={};
function rs(n){return "₹"+n}
function tabs(){var t=document.getElementById("tabs");t.innerHTML="";cats.forEach(function(c){var b=document.createElement("button");b.textContent=c;if(c===cur)b.className="on";b.onclick=function(){cur=c;tabs();grid()};t.appendChild(b)})}
function grid(){var g=document.getElementById("grid");g.innerHTML="";P.forEach(function(p,i){if(cur!=="All"&&p[0]!==cur)return;var d=document.createElement("div");d.className="card";var q=cart[i]||0;
d.innerHTML='<div class="emo">'+p[1]+'</div><h3>'+p[2]+'</h3><div class="p">'+rs(p[3])+' / '+p[4]+'</div>'+(q?'<div class="qty"><button data-i="'+i+'" data-d="-1">−</button><b>'+q+'</b><button data-i="'+i+'" data-d="1">+</button></div>':'<button class="add" data-i="'+i+'" data-d="1">Add</button>');g.appendChild(d)});upd()}
document.getElementById("grid").onclick=function(e){var b=e.target.closest("button");if(!b)return;var i=b.dataset.i,d=+b.dataset.d;cart[i]=Math.max(0,(cart[i]||0)+d);if(!cart[i])delete cart[i];grid()};
function sum(){var t=0,n=0;for(var i in cart){t+=cart[i]*P[i][3];n+=cart[i]}return[t,n]}
function upd(){var s=sum();document.getElementById("tot").textContent=rs(s[0]);document.getElementById("cnt").textContent=s[1]+" items"}
var dlg=document.getElementById("dlg");
document.getElementById("view").onclick=function(){var h="";for(var i in cart)h+='<div class="row"><span>'+P[i][1]+" "+P[i][2]+" × "+cart[i]+'</span><span>'+rs(cart[i]*P[i][3])+'</span></div>';document.getElementById("lines").innerHTML=h||"<p>Your cart is empty.</p>";document.getElementById("t2").textContent=rs(sum()[0]);dlg.showModal()};
document.getElementById("close").onclick=function(){dlg.close()};
var snd=document.getElementById("send");function link(){
var m="New Order%0A";for(var i in cart)m+="- "+encodeURIComponent(P[i][2]+" x "+cart[i]+" ("+P[i][4]+") = "+rs(cart[i]*P[i][3]))+"%0A";
m+="Total: "+encodeURIComponent(rs(sum()[0]))+"%0AName: "+encodeURIComponent(document.getElementById("nm").value)+"%0APhone: "+encodeURIComponent(document.getElementById("ph").value)+"%0AAddress: "+encodeURIComponent(document.getElementById("ad").value);
return "https://wa.me/"+WHATSAPP+"?text="+m}
snd.addEventListener("click",function(e){if(!sum()[1]){e.preventDefault();alert("Please add items first.");return}snd.href=link()});
tabs();grid();
</script>
</body>
</html>
